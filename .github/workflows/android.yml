name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PocketPlanet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPlanet-apk
          path: PocketPlanet.apk

      # On main, publish a release so the latest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/PocketPlanet.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" PocketPlanet.apk \
            --target "${{ github.sha }}" \
            --title "Pocket Planet for Android (build ${{ github.run_number }})" \
            --notes "Download PocketPlanet.apk below, open it on your phone or tablet, and allow installing from this source if Android asks. Then open Pocket Planet and tap Set wallpaper." \
            --latest
